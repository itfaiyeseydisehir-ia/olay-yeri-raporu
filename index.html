<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Olay Yeri Raporu</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #18222d);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #212d3b);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h2 { margin-top: 0; font-size: 18px; color: #eb5757; text-align: center; }
    .info-row { margin-bottom: 8px; font-size: 14px; }
    .info-row strong { color: #808080; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }

    /* Modal / Pencere Stilleri */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .modal-content {
      background: #212d3b;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .modal-header {
      font-size: 16px;
      font-weight: bold;
      color: #eb5757;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Personel Listesi Izgara Düzeni */
    .personel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      overflow-y: auto;
      background: #18222d;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3d4d5e;
      max-height: 320px;
    }
    .personel-item {
      display: flex;
      align-items: center;
      font-size: 13px;
      gap: 8px;
      cursor: pointer;
    }
    .personel-item input {
      width: 18px;
      height: 18px;
      accent-color: #27ae60;
    }

    /* Butonlar */
    .secim-btn {
      width: 100%;
      background: #34495e;
      color: #ffffff;
      border: 1px dashed #5d6d7e;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      text-align: center;
    }
    .secilen-ozet {
      margin-top: 8px;
      font-size: 13px;
      color: #2ecc71;
      font-weight: 500;
      background: #18222d;
      padding: 8px 12px;
      border-radius: 6px;
      min-height: 20px;
      word-break: break-word;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #3d4d5e;
      background: #18222d;
      color: #fff;
      padding: 10px;
      box-sizing: border-box;
      font-size: 14px;
      resize: none;
    }
    input[type="file"] { display: none; }
    .file-btn {
      display: block;
      text-align: center;
      background: #2f6ea5;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    #preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
    .submit-btn {
      width: 100%;
      background: #27ae60;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
    }
    .modal-confirm-btn {
      width: 100%;
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }
    .submit-btn:disabled { background: #555; }
    #status { margin-top: 10px; text-align: center; font-size: 13px; font-weight: bold; }

    /* Görüntüleme modu (rapor zaten eklenmişse) */
    .goruntu-personel {
      font-size: 14px;
      color: #2ecc71;
      font-weight: 500;
      margin-top: 6px;
    }
    .goruntu-not {
      font-size: 14px;
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .goruntu-zaman {
      font-size: 12px;
      color: #808080;
      margin-top: 10px;
      text-align: right;
    }
    #goruntuFoto {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <h2>📸 Olay Yeri Raporu</h2>

  <div class="card">
    <div class="info-row"><strong>Vaka No:</strong> <span id="vakaNo">-</span></div>
    <div class="info-row"><strong>Olay Türü:</strong> <span id="olayTuru">-</span></div>
  </div>

  <!-- Rapor zaten eklenmişse bu kart gösterilir, form gizlenir -->
  <div class="card" id="goruntuCard" style="display:none;">
    <label>✅ Rapor Zaten Eklenmiş</label>
    <div class="goruntu-personel" id="goruntuPersonel"></div>
    <img id="goruntuFoto" alt="Olay yeri fotoğrafı">
    <div class="goruntu-not" id="goruntuNot"></div>
    <div class="goruntu-zaman" id="goruntuZaman"></div>
  </div>

  <div class="card" id="formCard">
    <label>👨‍🚒 Görevdeki Personeller:</label>
    <button class="secim-btn" onclick="modalAc()">➕ Görevli Personel Seç</button>
    <div class="secilen-ozet" id="secilenOzet">Henüz personel seçilmedi.</div>

    <label>📷 Olay Yeri Fotoğrafı:</label>
    <label for="fotoInput" class="file-btn">Fotoğraf Çek / Seç</label>
    <input type="file" id="fotoInput" accept="image/*" capture="environment">
    <img id="preview" alt="Önizleme">

    <label>📝 Rapor Notu / Açıklama:</label>
    <textarea id="raporNotu" placeholder="Olay yerindeki durum, müdahale detayları..."></textarea>

    <button id="gonderBtn" class="submit-btn" onclick="raporGonder()">Raporu Kaydet ve Gönder</button>
    <div id="status"></div>
  </div>

  <!-- Personel Seçim Penceresi (Modal) -->
  <div id="personelModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">👨‍🚒 Görevli Personel Seçimi</div>
      <div class="personel-grid" id="personelContainer"></div>
      <button class="modal-confirm-btn" onclick="modalKapat()">Seçimi Tamamla</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const PERSONEL_LISTESI = [
      "Abdulkadir YÜKSEL", "Abdurrahman DOĞAN", "Adil USLU", "Ali AKYOL",
      "Berat Abdullah ÇAKAR", "Fahrettin YÜKSEL", "Fatih KARA", "Hasan BİLİCİ",
      "Kadir TURGUT", "Latif ÖZER", "Mehmet Ali SEVER", "Mesut BEZCİYARAR",
      "Mustafa AY", "Mustafa CESUR", "Necip KUT", "Nurettin DEĞERLİ",
      "Ramazan BALCI", "Ramazan GÜLHAN", "Ramazan KAYA", "Şükrü SARIKAYA",
      "Zekeriya TOPKAYA"
    ];

    const SUPABASE_URL = "https://gnufozcowbsrhcxbwhkf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdudWZvemNvd2JzcmhjeGJ3aGtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzI1MDQsImV4cCI6MjEwNTIwODUwNH0._KdQ6MvqPE0Mam2c_ozcwSyDmHW3Fc-9923lUKEEJic";
    const TELEGRAM_TOKEN = "8611680491:AAHMzHLoVo_FMzbjtQ_YIV2_jVZXDpbQCsE";
    const CHAT_ID = "-1004426681303";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const vakaNo = urlParams.get('vakaId') || 'Belirtilmedi';
    const olayTuru = urlParams.get('olayTuru') || 'Belirtilmedi';
    const msgId = urlParams.get('msgId'); // EKLENEN SATIR

    document.getElementById('vakaNo').innerText = vakaNo;
    document.getElementById('olayTuru').innerText = olayTuru;

    // Sayfa açılır açılmaz: bu vaka için zaten bir rapor kaydedilmiş mi diye bak.
    // Varsa formu gizleyip kaydedilen bilgi/fotoğrafı göster (görüntüleme modu).
    async function mevcutRaporuKontrolEt() {
      try {
        const { data, error } = await supabaseClient
          .from('olay_raporlari')
          .select('*')
          .eq('vaka_no', vakaNo)
          .order('created_at', { ascending: false })
          .limit(1);

        if (error) throw error;
        if (data && data.length > 0) {
          goruntuModunuGoster(data[0]);
        }
      } catch (err) {
        console.error('Mevcut rapor kontrol hatası:', err);
        // Hata olsa bile formu göstermeye devam et; kullanıcı yine de rapor girebilsin.
      }
    }

    function goruntuModunuGoster(rapor) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('goruntuCard').style.display = 'block';

      const personel = rapor['Görevli Personel'];
      document.getElementById('goruntuPersonel').innerText = personel
        ? `👨‍🚒 Ekip: ${personel}`
        : '👨‍🚒 Personel seçilmemiş.';

      const foto = document.getElementById('goruntuFoto');
      if (rapor.fotograf_url) {
        foto.src = rapor.fotograf_url;
        foto.style.display = 'block';
      }

      document.getElementById('goruntuNot').innerText = rapor.rapor_notu
        ? `📝 ${rapor.rapor_notu}`
        : '';

      if (rapor.created_at) {
        const tarih = new Date(rapor.created_at);
        document.getElementById('goruntuZaman').innerText =
          'Eklenme: ' + tarih.toLocaleString('tr-TR');
      }
    }

    mevcutRaporuKontrolEt();

    // Personel listesini modal içine basma
    const container = document.getElementById('personelContainer');
    PERSONEL_LISTESI.forEach((isim) => {
      const item = document.createElement('label');
      item.className = 'personel-item';
      item.innerHTML = `<input type="checkbox" value="${isim}" onchange="guncelleOzet()"> ${isim}`;
      container.appendChild(item);
    });

    function modalAc() {
      document.getElementById('personelModal').style.display = 'flex';
    }

    function modalKapat() {
      document.getElementById('personelModal').style.display = 'none';
    }

    function guncelleOzet() {
      const secilenler = Array.from(document.querySelectorAll('#personelContainer input:checked'))
        .map(cb => cb.value);
      const ozetEl = document.getElementById('secilenOzet');
      
      if (secilenler.length > 0) {
        ozetEl.style.color = "#2ecc71";
        ozetEl.innerText = `Seçilenler (${secilenler.length}): ` + secilenler.join(', ');
      } else {
        ozetEl.style.color = "#808080";
        ozetEl.innerText = "Henüz personel seçilmedi.";
      }
    }

    const fotoInput = document.getElementById('fotoInput');
    const preview = document.getElementById('preview');

    fotoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    });

    async function raporGonder() {
      const btn = document.getElementById('gonderBtn');
      const status = document.getElementById('status');
      const raporNotu = document.getElementById('raporNotu').value;
      const file = fotoInput.files[0];

      const secilenPersoneller = Array.from(document.querySelectorAll('#personelContainer input:checked'))
        .map(cb => cb.value);

      if (secilenPersoneller.length === 0 && !file && !raporNotu.trim()) {
        alert("Lütfen en az bir personel seçin, fotoğraf ekleyin veya açıklama yazın.");
        return;
      }

      btn.disabled = true;
      status.style.color = "#f39c12";
      status.innerText = "Yükleniyor, lütfen bekleyin...";

      try {
        let fotoUrl = "";

        if (file) {
          const dosyaAdi = `${vakaNo}_${Date.now()}.jpg`;
          const { data, error } = await supabaseClient.storage
            .from('olay-fotograflari')
            .upload(dosyaAdi, file);

          if (error) throw error;

          const publicRes = supabaseClient.storage
            .from('olay-fotograflari')
            .getPublicUrl(dosyaAdi);

          fotoUrl = publicRes.data.publicUrl;
        }

        const personelMetni = secilenPersoneller.join(', ');

        const { error: dbError } = await supabaseClient
          .from('olay_raporlari')
          .insert([{ 
            vaka_no: vakaNo, 
            olay_turu: olayTuru, 
            rapor_notu: raporNotu, 
            fotograf_url: fotoUrl,
            "Görevli Personel": personelMetni
          }]);

        if (dbError) throw dbError;

        // EĞER URL'DE MSGID VARSA ORİJİNAL MESAJIN BUTONUNU GÜNCELLE
        if (msgId) {
          const guncelLink = window.location.href;

          // Varış/Ayrılış/Dönüş saatlerini bot'un Supabase'e yazdığı yerden oku ki
          // checkmark'lar ("✅ ... 14:35" gibi) klavye yeniden kurulurken kaybolmasın.
          let zamanlar = {};
          try {
            const { data: zamanVerisi, error: zamanHata } = await supabaseClient
              .from('vaka_zamanlari')
              .select('varis, ayrilis, donus')
              .eq('message_id', Number(msgId))
              .maybeSingle();
            if (!zamanHata && zamanVerisi) zamanlar = zamanVerisi;
          } catch (e) {
            console.error('Zaman bilgisi okuma hatası:', e);
          }

          // Bot_v233.js'deki anaMenuKeyboard ile BİREBİR AYNI sıra/yapı:
          // [çıkış, varış] / [ayrılış, dönüş] / [rapor] / [manuel saat gir]
          const yeniKlavye = {
            inline_keyboard: [
              [
                { text: "🚦 İstasyondan Çıkış", callback_data: "cikis" },
                {
                  text: zamanlar.varis ? `✅ Olay Y. Varış ${zamanlar.varis}` : "📍 Olay Y. Varış",
                  callback_data: "varis"
                }
              ],
              [
                {
                  text: zamanlar.ayrilis ? `✅ Olay Y. Ayrılış ${zamanlar.ayrilis}` : "🏁 Olay Y. Ayrılış",
                  callback_data: "ayrilis"
                },
                {
                  text: zamanlar.donus ? `✅ İstasyona Dönüş ${zamanlar.donus}` : "🏠 İstasyona Dönüş",
                  callback_data: "donus"
                }
              ],
              [
                { text: "✅ Olay Yeri Raporu Eklendi", url: guncelLink }
              ],
              [
                { text: "✏️ Manuel Saat Gir", callback_data: "duzelt" }
              ]
            ]
          };

          const editSonucu = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/editMessageReplyMarkup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              message_id: Number(msgId),
              reply_markup: yeniKlavye
            })
          });
          const editVerisi = await editSonucu.json();
          if (!editVerisi.ok) {
            console.error('Buton güncelleme hatası:', editVerisi.description);
          }
        }

        status.style.color = "#2ecc71";
        status.innerText = "Rapor başarıyla gönderildi!";
        setTimeout(() => tg.close(), 1500);

      } catch (err) {
        console.error(err);
        status.style.color = "#e74c3c";
        status.innerText = "Hata oluştu: " + err.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
